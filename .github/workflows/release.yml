name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match package.json version
        run: node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('tag v'+t+' != package.json '+v);process.exit(1)}"
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Pack
        run: npm pack
      # Opt-in npm lane: add an NPM_TOKEN repo secret (automation token) and
      # the tag push also publishes to npm, enabling `dsh plugin add
      # dsh-vpn-toggle`. Without the secret the release stops at the tarball.
      - name: Publish to npm (opt-in)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
