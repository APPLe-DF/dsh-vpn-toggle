name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) — no token secret needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag must match package.json version
        run: node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('tag v'+t+' != package.json '+v);process.exit(1)}"
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Pack
        run: npm pack
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Trusted publishing (OIDC): zero tokens. Requires the package's
      # Trusted Publisher on npmjs.com to point at this repo + release.yml.
      # The OIDC exchange needs npm >= 11.5.1, hence the upgrade.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm - skipping publish"
          else
            npm publish --access public --provenance
          fi
