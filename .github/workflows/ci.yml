name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.19.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/pure.js
          node --check verify.mjs
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Pack manifest
        run: npm pack --dry-run

  package-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install packed tarball and inspect exports
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          temp="$(mktemp -d)"
          printf '{"private":true}\n' > "$temp/package.json"
          npm install --prefix "$temp" --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
          cd "$temp"
          node --input-type=module -e "const pkg = await import('dsh-proxy-toggle/package.json', { with: { type: 'json' } }); if (pkg.default.name !== 'dsh-proxy-toggle') throw new Error('bad package manifest'); await import('dsh-proxy-toggle'); const clientUrl = import.meta.resolve('dsh-proxy-toggle/client'); if (!clientUrl.endsWith('/lib/client.js')) throw new Error('bad client export: ' + clientUrl);"
